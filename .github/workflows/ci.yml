name: CI

# NOTE (aaronzi, 2026-11-05):
# The workflow used to run only on changes in dev_scripts/. We run it on every
# change now so that the REUSE check also catches files added elsewhere
# (e.g., the generated definitions or the documentation) without a header.
on:
  push:
    branches: ['main']
  pull_request:
    branches: [ 'main' ]

jobs:
  Precommit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    defaults:
      run:
        working-directory: ./dev_scripts

    steps:
      - uses: actions/checkout@master

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e .[dev]

      - name: Run precommit.py
        run: python3 precommit.py

  Reuse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reuse
        run: |
          python3 -m pip install --upgrade pip
          pip3 install reuse==6.3.0

      - name: Check the REUSE compliance
        run: reuse lint
