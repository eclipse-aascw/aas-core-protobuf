version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README and CONTRIBUTING shown on GitHub).
[[annotations]]
path = ["AUTHORS", "README.md", "CONTRIBUTING.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 aas-core-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated definitions by
# aas-core-codegen (e.g., as the package name), so they must not carry
# a header of their own.
[[annotations]]
path = "dev_scripts/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 aas-core-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The code generated from the meta-model transcribes the AAS
# specification: the doc comments derived from its docstrings quote
# the definitions of the classes, attributes and constraints. That text keeps
# the license of the specification, next to the MIT license of our own code.
# The specifications published by IDTA are licensed under CC BY 4.0.
[[annotations]]
path = "v3/types.proto"
precedence = "aggregate"
SPDX-FileCopyrightText = "Industrial Digital Twin Association e. V."
SPDX-License-Identifier = "CC-BY-4.0"
